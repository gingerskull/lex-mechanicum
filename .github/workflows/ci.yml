name: CI

# Pull requests only (drafts run nothing), plus a weekly safety-net run on main. No CI on pushes to main: the PR
# already checked its merge ref. Heavy checks (snapshots, bench, screenshots) run locally, never here.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          # Everything except prose. The site build job (step 8) adds its own filter here.
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!.github/ISSUE_TEMPLATE/**"

  check:
    name: Check
    needs: changes
    # Scheduled and manual runs skip "What changed" and always check.
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
