name: CI

# Pull requests only (drafts run nothing), plus a weekly safety-net run on main. No CI on pushes to main: the PR
# already checked its merge ref. Heavy checks (snapshots, bench, screenshots) run locally, never here.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          # code: everything except prose. site: what the pages, packages and thumbnails are built from.
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!.github/ISSUE_TEMPLATE/**"
            # one pattern: the quantifier "every" applies to every filter
            site:
              - "{site/**,src/**,data/catalog/**,tools/**,package.json,package-lock.json}"

  check:
    name: Check
    needs: changes
    # Scheduled and manual runs skip "What changed" and always check.
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    # the 3D build: every mechanism built once from its record and checked, in a pool of processes: about 4 min
    # with nothing cached
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the build cache (dist/cache): each mechanism's build is keyed on its own sources (src/package/built.ts), so a
      # run reuses every build of the last run that still holds, and a change to one mechanism builds only that one
      - uses: actions/cache@v4
        with:
          path: dist/cache
          key: build-${{ runner.os }}-node22-check-${{ hashFiles('src/**', 'data/catalog/**', 'package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-node22-check-
            build-${{ runner.os }}-node22-
      - run: npm run check

  site:
    name: Site build
    needs: changes
    # Scheduled and manual runs skip "What changed" and always build.
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.site == 'true')
    runs-on: ubuntu-latest
    # every mechanism's package is built from its record, in a pool of processes: about 2 min on the runner
    timeout-minutes: 6
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the build cache (dist/cache): each mechanism's build is keyed on its own sources (src/package/built.ts), so a
      # run reuses every build of the last run that still holds, and a change to one mechanism builds only that one
      - uses: actions/cache@v4
        with:
          path: dist/cache
          key: build-${{ runner.os }}-node22-site-${{ hashFiles('src/**', 'data/catalog/**', 'package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-node22-site-
            build-${{ runner.os }}-node22-
      - run: npm run build
      - run: npm run test:site
