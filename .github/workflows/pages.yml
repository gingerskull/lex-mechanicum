name: Pages

# Publishes the static site to GitHub Pages (https://gingerskull.github.io/mechanism-database/) when a merge to main
# changes what the site is built from, or on demand. The PR's "Site build" job has already checked the build.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "data/catalog/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deploy at a time; a newer merge waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # every mechanism's package is built from its record, in a pool of processes: about 2 min on the runner
    timeout-minutes: 6
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      SITE_BASE: /mechanism-database/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
