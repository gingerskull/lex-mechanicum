name: Pages

# Publishes the static site to GitHub Pages (https://gingerskull.github.io/lex-mechanicum/) when a merge to main
# changes what the site is built from, or on demand. The PR's "Site build" job has already checked the build.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "data/catalog/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deploy at a time; a newer merge waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # every mechanism's package is built from its record, in a pool of processes: about 2 min on the runner
    timeout-minutes: 6
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      SITE_BASE: /lex-mechanicum/
    outputs:
      indexnow-key: ${{ steps.indexnow.outputs.key }}
      indexnow-urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the build cache, as in the CI workflow (dist/cache, each mechanism keyed on its own sources); saved here on main,
      # where every pull request's run can restore it
      - uses: actions/cache@v4
        with:
          path: dist/cache
          key: build-${{ runner.os }}-node22-site-${{ hashFiles('src/**', 'data/catalog/**', 'package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-node22-site-
      - run: npm run build
      # IndexNow's key (site/src/seo.ts, served as dist/site/<key>.txt) and the sitemap's URLs, for the deploy's last step
      - id: indexnow
        run: |
          echo "key=$(basename dist/site/[0-9a-f]*.txt .txt)" >> "$GITHUB_OUTPUT"
          echo "urls=$(grep -o '<loc>[^<]*</loc>' dist/site/sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tells Bing, Yandex and the other IndexNow engines that the site's pages changed: every URL of the sitemap, with
      # the key file that proves the site is ours. Best effort: it never fails the deploy.
      - name: IndexNow
        continue-on-error: true
        timeout-minutes: 1
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          KEY: ${{ needs.build.outputs.indexnow-key }}
          URLS: ${{ needs.build.outputs.indexnow-urls }}
        run: |
          body=$(jq -nc --arg host "$(echo "$SITE" | cut -d/ -f3)" --arg key "$KEY" --arg loc "${SITE}${KEY}.txt" --argjson urls "$URLS" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow: HTTP $code for $(echo "$URLS" | jq length) URLs"
